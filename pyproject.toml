[project]
name = "accessflow"
version = "0.1.0"
description = "Queue-based conversational correction and action safety prototype"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.9,<3", "jsonschema>=4.23,<5", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
audio = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
