name: Offline contracts and engine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
          python-version: '3.11'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run accessflow replay scenarios/dev/text_correction.json
      - run: docker build -t accessflow .
      - run: docker run --rm accessflow
